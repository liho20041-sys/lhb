mqtt:
  enabled: false

auth:
  enabled: false

detect:
  enabled: true

model:
  path: /config/yolo11n.onnx
  model_type: yolo-generic
  width: 640
  height: 640
  input_tensor: nchw
  input_pixel_format: rgb
  input_dtype: float
  labelmap_path: /config/coco80.txt

detectors:
  onnx:
    type: onnx
    device: GPU

cameras:
  demo:
    ffmpeg:
      hwaccel_args: preset-nvidia-h264
      inputs:
        - path: /media/avenue.mp4
          input_args: -re -stream_loop -1
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 10
    objects:
      track:
        - person
        - bicycle
        - car
        - motorcycle
        - bus
        - truck
    snapshots:
      enabled: true
      bounding_box: true
      timestamp: true
      retain:
        default: 3
    record:
      enabled: false

version: 0.18-0
